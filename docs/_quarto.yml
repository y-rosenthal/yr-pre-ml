project:
  type: book
  output-dir: _book

book:
  title: "yr-pre-ml: project docs"
  chapters:
    - index.qmd
    - PROJECT-SETUP.qmd
    - part: "Specification"
      chapters:
        - SPEC-v0.1.0.qmd
    - part: "Guides"
      chapters:
        - DOC-GUIDE-v001.qmd
        - QUARTO-GUIDE-v001.qmd
    - part: "Work"
      chapters:
        - PLANNING-v001.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
